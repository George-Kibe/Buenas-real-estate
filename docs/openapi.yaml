  /api/v1/properties/upload-image/{slug}/:
    post:
      operationId: properties_upload_image_create
      description: |-
        Replace one or more photos on a listing you own.

        Only the fields present in the request are touched, so posting just
        `photo2` leaves the cover photo alone.
      summary: Upload photos for a property you own
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PropertyImageUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Image(s) uploaded
        '400':
          description: Not a valid image
        '401':
          description: Authentication required
        '403':
          description: Not your property
        '404':
          description: No such property
