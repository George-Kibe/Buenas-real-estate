      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ratings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: ''
        '400':
          description: Invalid rating, or already reviewed
        '401':
          description: Authentication required
        '403':
          description: You cannot rate yourself
