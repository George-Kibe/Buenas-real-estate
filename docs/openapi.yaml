  /api/v1/properties/agents/:
    get:
      operationId: properties_agents_list
      description: The signed-in user's own listings.
      parameters:
      - in: query
        name: advert_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price
        schema:
          type: number
      - in: query
        name: price__gt
        schema:
          type: number
      - in: query
        name: price__lt
        schema:
          type: number
      - in: query
        name: property_type
        schema:
          type: string
      - name: search
        required: false
        in: query
