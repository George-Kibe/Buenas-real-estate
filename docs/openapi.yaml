  /api/v1/properties/create/:
    post:
      operationId: properties_create_create
      description: The owner is taken from the access token, never the body.
      summary: Create a property
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyCreate'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Authentication required
  /api/v1/properties/delete/{slug}/:
    delete:
      operationId: properties_delete_destroy
      summary: Delete a property you own
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          description: Authentication required
        '403':
          description: Not your property
        '404':
          description: No such property
